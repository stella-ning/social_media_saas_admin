</div>
<button class="el-button-primary px-4 py-2 rounded text-sm flex items-center gap-1">
<iconify-icon icon="ri:download-line"></iconify-icon> 导出线索
                    </button>
</div>
<table class="w-full el-table text-sm">

</tr>

<tbody id="leadsTableBody">
<tr>
<td class="px-4 py-4 font-medium">爱生活的Lily</td>
<td class="px-4 py-4 font-mono">138****9901</td>
<td class="px-4 py-4">
<div class="text-xs text-[#409eff] truncate w-40">"这款护肤品怎么代理？"</div>
<div class="text-[10px] text-gray-400">来源：小红书</div>
</td>
<td class="px-4 py-4 tenant-col">广州悦享科技</td>
<td class="px-4 py-4 text-red-500 font-bold">95</td>
<td class="px-4 py-4"><span class="px-2 py-0.5 bg-green-50 text-green-600 rounded text-xs">已接洽</span></td>
<td class="px-4 py-4 text-gray-500">张三(业务员A)</td>
<td class="px-4 py-4">
<div class="flex gap-3">
<button class="text-[#409eff] hover:underline">详情</button>
<button class="text-[#409eff] hover:underline action-btn">打标</button>
</div>
</td>
</tr>
<tr>
<td class="px-4 py-4 font-medium">科技发烧友</td>
<td class="px-4 py-4 font-mono">155****8822</td>
<td class="px-4 py-4">
<div class="text-xs text-[#409eff] truncate w-40">"求批发价，私我"</div>
<div class="text-[10px] text-gray-400">来源：抖音</div>
</td>
<td class="px-4 py-4 tenant-col">上海晨风服饰</td>
<td class="px-4 py-4 text-orange-500 font-bold">82</td>
<td class="px-4 py-4"><span class="px-2 py-0.5 bg-blue-50 text-blue-600 rounded text-xs">未处理</span></td>

<button class="text-[#409eff] hover:underline action-btn">打标</button>

</td>

</div>
<script>
        function updateSidebar() {
            const role = localStorage.getItem('currentRole') || 'super_admin';
            const sidebarItems = document.querySelectorAll('.sidebar-item');
            
            // 首先显示所有项，防止全部消失
            sidebarItems.forEach(item => {
                item.style.display = 'flex';
            });
            
            // 定义不同角色需要隐藏的项 (基于文件名)
            const hideConfig = {
                'super_admin': [],
                'tenant_admin': ['tenant_management.html', 'proxy_ip.html', 'settings.html'],
                'operator': ['tenant_management.html', 'social_accounts.html', 'crawler_tasks.html', 'proxy_ip.html', 'ai_config.html', 'settings.html']
            };
            
            const toHide = hideConfig[role] || [];
            
            sidebarItems.forEach(item => {
                const href = item.getAttribute('href');
                if (href) {
                    const fileName = href.split('/').pop();
                    if (toHide.includes(fileName)) {
                        item.style.display = 'none';
                    }
                }
            });
        }
        function updateRoleUI() {
            const role = localStorage.getItem('currentRole') || 'super_admin';
            const roleSelect = document.getElementById('roleSelect');
            if (roleSelect) roleSelect.value = role;
            const roleLabel = document.getElementById('roleLabel');
            if (roleLabel) {
                const roles = {
                    'super_admin': { text: '超级管理员', class: 'text-blue-500 bg-blue-50' },
                    'tenant_admin': { text: '租户管理员', class: 'text-green-500 bg-green-50' },
                    'operator': { text: '业务员', class: 'text-orange-500 bg-orange-50' }
                };
                roleLabel.innerText = roles[role].text;
                roleLabel.className = `text-[10px] px-1.5 py-0.5 rounded ${roles[role].class} leading-tight font-medium`;
            }
        }
        function updatePageContent() {
            const role = localStorage.getItem('currentRole') || 'super_admin';
            const roleContext = document.getElementById('roleContext');
            const tenantSelect = document.getElementById('tenantSelect');
            const rows = document.getElementById('leadsTableBody').rows;

            if (role === 'tenant_admin') {
                tenantSelect.style.display = 'none';
                roleContext.innerText = '(当前租户：广州悦享科技有限公司)';
                document.querySelectorAll('.tenant-col').forEach(el => el.style.display = 'none');
                rows[1].style.display = 'none';
            } else if (role === 'operator') {
                tenantSelect.style.display = 'none';
                roleContext.innerText = '(当前查看：个人跟进线索)';
                document.querySelectorAll('.tenant-col').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.action-btn').forEach(el => {
                    el.disabled = true;
                    el.className = 'text-gray-400 cursor-not-allowed';
                });
                rows[1].style.display = 'none';
            }
        }
        function changeRole(role) {
            localStorage.setItem('currentRole', role);
            location.reload();
        }
        document.addEventListener('DOMContentLoaded', () => {
            updateSidebar();
            updateRoleUI();
            updatePageContent();
        });
    </script>
</body>
